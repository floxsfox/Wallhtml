name: Extract ZIP and Build APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to the project ZIP in the repository (for example: wallhtml.zip)'
        required: true
        default: 'wallhtml.zip'
        type: string
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        env:
          ZIP_PATH: ${{ inputs.zip_path || 'wallhtml.zip' }}
        run: |
          if [ ! -f "$ZIP_PATH" ]; then
            echo "ZIP file not found: $ZIP_PATH"
            echo "Put the project ZIP in the repository, then run this workflow again."
            exit 1
          fi
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted-project
          unzip -q "$ZIP_PATH" -d extracted-project
          PROJECT_DIR=$(find extracted-project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project extracted to: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallhtml-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
