name: Build wallhtml APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek (unzip otomatis kalau diupload sebagai zip)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            if [ -f wallhtml.zip ]; then
              ZIP=wallhtml.zip
            else
              ZIP=$(ls ./*.zip 2>/dev/null | grep -v promo | head -n 1)
            fi
            if [ -z "$ZIP" ]; then
              echo "Tidak ada file .zip proyek di root repo"
              exit 1
            fi
            unzip -q "$ZIP" -d _proj
            SETTINGS=$(find _proj -name settings.gradle.kts | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "settings.gradle.kts tidak ditemukan di dalam zip"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wallhtml-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
