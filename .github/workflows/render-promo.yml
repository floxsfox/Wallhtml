name: Render video promo

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek (unzip otomatis kalau diupload sebagai zip)
        run: |
          if [ -f package.json ] && [ -d src ]; then
            echo "PROMO_DIR=." >> "$GITHUB_ENV"
          else
            if [ ! -f wallhtml-promo.zip ]; then
              echo "wallhtml-promo.zip tidak ada di root repo"
              exit 1
            fi
            unzip -q wallhtml-promo.zip -d _promo
            PKG=$(find _promo -name package.json -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$PKG" ]; then
              echo "package.json tidak ditemukan di dalam zip"
              exit 1
            fi
            echo "PROMO_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang library untuk Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: npm install
        working-directory: ${{ env.PROMO_DIR }}
        run: npm install --no-audit --no-fund

      - name: Render video
        working-directory: ${{ env.PROMO_DIR }}
        run: npx remotion render src/index.ts Promo out/wallhtml-promo.mp4 --codec=h264 --crf=18

      - uses: actions/upload-artifact@v4
        with:
          name: wallhtml-promo-video
          path: ${{ env.PROMO_DIR }}/out/wallhtml-promo.mp4
          
